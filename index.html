<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#f5f0e8"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<!-- ✅ FIX 1: black-translucent makes it truly fullscreen/standalone like Venato -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Study Log"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Study Log</title>

<!-- ✅ FIX 2: Blob-URL manifest — Safari ignores data: URI manifests entirely -->
<script>
(function(){
  try {
    var m = {
      name: "Study Log",
      short_name: "Study Log",
      start_url: ".",
      display: "standalone",
      background_color: "#f5f0e8",
      theme_color: "#f5f0e8",
      orientation: "portrait"
    };
    var blob = new Blob([JSON.stringify(m)], {type: 'application/manifest+json'});
    var url  = URL.createObjectURL(blob);
    var link = document.createElement('link');
    link.rel  = 'manifest';
    link.href = url;
    document.head.appendChild(link);
  } catch(e) {}
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'Lato', 'Helvetica Neue', sans-serif;
    --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
    --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
    --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
    --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
    --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.1rem);
    --space-1: .25rem; --space-2: .5rem; --space-3: .75rem; --space-4: 1rem;
    --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem;
    --space-10: 2.5rem; --space-12: 3rem;
    --color-bg: #f5f0e8; --color-surface: #f9f6ef;
    --color-surface-2: #fdfbf7; --color-surface-offset: #ede6d8;
    --color-divide: #d9d0c0; --color-border: #ccc3b0;
    --color-text: #2c241a; --color-text-muted: #6b5d4e;
    --color-text-faint: #a89880;
    --color-primary: #3d6b4f; --color-primary-hover: #2e5239;
    --color-primary-highlight: #d4e3da;
    --color-accent: #8b3a3a; --color-accent-highlight: #e8d5d5;
    --radius-sm: .25rem; --radius-md: .5rem; --radius-lg: .75rem;
    --radius-xl: 1rem; --radius-full: 9999px;
    --shadow-sm: 0 1px 3px oklch(0.2 0.02 60 / 0.08);
    --shadow-md: 0 4px 12px oklch(0.2 0.02 60 / 0.10);
    --transition: 180ms cubic-bezier(0.16,1,0.3,1);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body {
    min-height: 100dvh; font-family: var(--font-body); font-size: var(--text-base);
    line-height: 1.6; color: var(--color-text); background: var(--color-bg);
    max-width: 480px; margin: 0 auto; padding-top: var(--safe-top);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { border: none; background: none; cursor: pointer; }
  h1,h2,h3 { font-family: var(--font-display); line-height: 1.15; }
  a, button, input, select, textarea {
    transition: background var(--transition), color var(--transition),
    border-color var(--transition), box-shadow var(--transition), transform var(--transition);
  }
  :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; border-radius: var(--radius-sm); }

  .app-header {
    position: sticky; top: 0; z-index: 10; background: var(--color-bg);
    border-bottom: 1px solid var(--color-divide);
    padding: var(--space-4) var(--space-5);
    display: flex; align-items: center; justify-content: space-between;
  }
  .app-logo { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; }
  .app-logo svg { color: var(--color-primary); }
  .date-label { font-size: var(--text-xs); color: var(--color-text-muted); font-style: italic; }

  .page-content { padding: var(--space-5) var(--space-5) calc(92px + var(--safe-bottom)); min-height: calc(100dvh - 60px); }
  .page { display: none; }
  .page.active { display: block; }
  .page-title { font-size: var(--text-xl); margin-bottom: var(--space-1); }
  .page-subtitle { font-size: var(--text-sm); color: var(--color-text-muted); font-style: italic; margin-bottom: var(--space-5); }
  .section-label {
    font-size: var(--text-xs); letter-spacing: .1em; text-transform: uppercase;
    color: var(--color-text-faint); font-weight: 700; margin: var(--space-5) 0 var(--space-3);
  }
  .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
  .hero-card, .form-card, .project-card, .history-card, .goal-card, .stat-card { padding: var(--space-5); }

  .hero-meta, .meta-row, .goal-meta {
    display: flex; flex-wrap: wrap; gap: var(--space-3);
    font-size: var(--text-xs); color: var(--color-text-muted); font-style: italic;
  }
  .hero-meta { text-transform: uppercase; letter-spacing: .08em; font-style: normal; justify-content: space-between; }
  .hero-task { font-family: var(--font-display); font-size: clamp(1.7rem,1.5rem + 1.2vw,2.3rem); margin: var(--space-4) 0 var(--space-2); }
  .hero-subject { font-size: var(--text-sm); color: var(--color-text-muted); font-style: italic; }

  .timer-wrap { margin: var(--space-5) 0; display: grid; place-items: center; }
  .timer-ring {
    width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, var(--color-surface-2) 58%, transparent 59%),
                conic-gradient(var(--color-primary) calc(var(--progress) * 1%), var(--color-surface-offset) 0);
    display: grid; place-items: center;
    box-shadow: inset 0 0 0 1px var(--color-border), var(--shadow-sm);
  }
  .timer-inner {
    width: 150px; height: 150px; border-radius: 50%; background: var(--color-bg);
    display: grid; place-items: center; text-align: center; padding: var(--space-3);
  }
  .timer-time { font-family: var(--font-display); font-size: 2rem; font-variant-numeric: tabular-nums; }
  .timer-note { font-size: var(--text-xs); color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .08em; }

  .inline-actions { display: flex; justify-content: center; gap: var(--space-3); margin-top: var(--space-2); }
  .quiet-btn {
    padding: var(--space-2) var(--space-3); border-radius: var(--radius-full);
    border: 1px solid var(--color-border); font-size: 11px;
    text-transform: uppercase; letter-spacing: .07em;
    color: var(--color-text-muted); background: var(--color-surface-2);
  }

  .slide-shell {
    background: var(--color-surface-offset); border: 1px solid var(--color-border);
    border-radius: var(--radius-full); padding: 6px;
    position: relative; overflow: hidden; margin-top: var(--space-5);
  }
  .slide-track { height: 56px; position: relative; user-select: none; }
  .slide-label {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: var(--text-sm); font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--color-text-muted);
  }
  .slide-thumb {
    position: absolute; left: 0; top: 0; width: 56px; height: 56px;
    border-radius: 50%; background: var(--color-primary);
    display: grid; place-items: center; color: white;
    box-shadow: var(--shadow-md); touch-action: none;
  }
  .slide-thumb svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }

  .mini-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: var(--space-3); margin-bottom: var(--space-5); }
  .stat-label { font-size: var(--text-xs); letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-faint); font-weight: 700; }
  .stat-value { font-family: var(--font-display); font-size: var(--text-lg); margin-top: 2px; }

  .project-list, .history-list, .goal-list { display: flex; flex-direction: column; gap: var(--space-3); }
  .project-top, .history-top, .goal-top { display: flex; justify-content: space-between; gap: var(--space-3); align-items: flex-start; }
  .project-name, .history-name, .goal-name { font-size: var(--text-base); }
  .badge { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 8px; border-radius: var(--radius-full); }
  .badge.primary { background: var(--color-primary-highlight); color: var(--color-primary); }
  .badge.accent  { background: var(--color-accent-highlight);   color: var(--color-accent); }
  .project-card.active-project { border-color: var(--color-primary); border-width: 2px; }
  .project-actions, .history-actions, .goal-actions { display: flex; gap: var(--space-2); margin-top: var(--space-4); }
  .ghost-btn {
    padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
    border: 1px solid var(--color-border); font-size: 11px;
    text-transform: uppercase; letter-spacing: .06em; color: var(--color-text-muted);
  }

  .form-group { margin-bottom: var(--space-4); }
  .form-label { display: block; font-size: var(--text-sm); font-weight: 700; margin-bottom: var(--space-2); }
  .form-input, .form-select, .form-textarea {
    width: 100%; padding: var(--space-3) var(--space-4);
    border: 1.5px solid var(--color-border); border-radius: var(--radius-md);
    background: var(--color-bg);
  }
  .form-textarea { min-height: 86px; resize: vertical; }
  .btn-primary {
    width: 100%; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md);
    font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    background: var(--color-primary); color: white;
  }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }

  .rating-row { display: grid; grid-template-columns: repeat(5,1fr); gap: var(--space-2); margin: var(--space-4) 0; }
  .rating-btn {
    padding: var(--space-4) 0; border: 2px solid var(--color-border);
    border-radius: var(--radius-md); background: var(--color-surface-2);
    font-family: var(--font-display); font-size: 1.4rem; font-weight: 700;
    color: var(--color-text-muted); min-height: 64px;
  }
  .rating-btn.active { background: var(--color-primary-highlight); border-color: var(--color-primary); color: var(--color-primary); }

  .empty-state {
    padding: var(--space-10) var(--space-5); text-align: center;
    color: var(--color-text-muted); background: var(--color-surface);
    border: 1px dashed var(--color-border); border-radius: var(--radius-lg);
  }
  .empty-state h3 { font-size: var(--text-lg); margin-bottom: var(--space-2); color: var(--color-text); }

  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: var(--color-surface); border-top: 1px solid var(--color-divide);
    display: flex; z-index: 12; padding-bottom: var(--safe-bottom);
    box-shadow: 0 -2px 12px oklch(0.2 0.02 60 / 0.06);
  }
  .nav-btn {
    flex: 1; padding: var(--space-3) var(--space-2);
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: var(--color-text-faint); font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em;
    border-top: 2px solid transparent;
  }
  .nav-btn.active { color: var(--color-primary); border-top-color: var(--color-primary); }
  .nav-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; }

  .toast {
    position: fixed; left: 50%; bottom: calc(86px + var(--safe-bottom));
    transform: translateX(-50%);
    background: var(--color-text); color: var(--color-bg);
    padding: var(--space-3) var(--space-5); border-radius: var(--radius-full);
    font-size: var(--text-sm); box-shadow: var(--shadow-md);
    z-index: 25; opacity: 0; pointer-events: none; transition: opacity 200ms;
  }
  .toast.show { opacity: 1; }

  canvas { margin-top: var(--space-4); background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-4); }

  .install-note {
    margin-top: var(--space-5); padding: var(--space-4);
    font-size: var(--text-xs); color: var(--color-text-muted);
    background: var(--color-surface-offset); border-radius: var(--radius-lg);
    border: 1px solid var(--color-border);
  }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.45);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 220ms;
  }
  .modal-overlay.open { opacity: 1; pointer-events: auto; }
  .modal-sheet {
    width: 100%; max-width: 480px; background: var(--color-bg);
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    padding: var(--space-6) var(--space-5) calc(var(--space-8) + var(--safe-bottom));
    box-shadow: 0 -8px 32px rgba(0,0,0,0.18);
    transform: translateY(40px); transition: transform 240ms cubic-bezier(0.16,1,0.3,1);
  }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-handle { width: 40px; height: 4px; border-radius: 2px; background: var(--color-border); margin: 0 auto var(--space-4); }
  .modal-title { font-family: var(--font-display); font-size: var(--text-lg); margin-bottom: var(--space-2); }
  .modal-subtitle { font-size: var(--text-sm); color: var(--color-text-muted); margin-bottom: var(--space-4); }
  .rating-desc { text-align: center; font-size: var(--text-sm); color: var(--color-text-muted); font-style: italic; min-height: 1.4em; margin-bottom: var(--space-4); }

  .stats-grid-4 { display: grid; grid-template-columns: repeat(2,1fr); gap: var(--space-3); margin-bottom: var(--space-4); }
  .subject-table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
  .subject-table th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--color-text-faint); padding: var(--space-2) var(--space-3); background: var(--color-surface-offset); }
  .subject-table td { padding: var(--space-2) var(--space-3); border-top: 1px solid var(--color-divide); }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h6M9 11h4"/>
    </svg>
    Study Log
  </div>
  <span class="date-label" id="header-date"></span>
</header>

<main>
  <!-- TODAY -->
  <section class="page active" id="page-today">
    <div class="page-content">
      <h1 class="page-title">Today</h1>
      <p class="page-subtitle">Track focused homework sessions.</p>
      <div class="card hero-card">
        <div class="hero-meta">
          <span id="heroProjectStatus">No active project</span>
          <span id="heroEstimate">No estimate yet</span>
        </div>
        <div class="hero-task" id="heroTask">Start a study session</div>
        <div class="hero-subject" id="heroSubject">
