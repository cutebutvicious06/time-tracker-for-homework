<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Venato Study" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#f5f0e8" />
  <title>Venato Study</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-display: "Playfair Display", Georgia, serif;
      --font-body: "Lato", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --color-bg: #f5f0e8;
      --color-surface: #f9f6ef;
      --color-surface-2: #fdfbf7;
      --color-surface-offset: #ede6d8;
      --color-border: #ccc3b0;
      --color-divider: #d9d0c0;
      --color-text: #2c241a;
      --color-text-muted: #6b5d4e;
      --color-text-faint: #a89880;
      --color-primary: #3d6b4f;
      --color-primary-highlight: #d4e3da;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 1rem;
      border-bottom: 1px solid var(--color-divider);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; }
    main { flex: 1; padding: 1rem; overflow-y: auto; }
    .timer-container {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 1rem;
      padding: 2rem;
      text-align: center;
      margin-bottom: 1rem;
    }
    .timer-display { font-family: var(--font-display); font-size: 3rem; margin: 1rem 0; }
    .btn-row { display: flex; gap: 0.5rem; justify-content: center; margin-bottom: 1rem; }
    button {
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      border: 1px solid var(--color-border);
      background: var(--color-surface-2);
      font-weight: 700;
      cursor: pointer;
    }
    button.primary { background: var(--color-primary); color: white; border-color: var(--color-primary); }
    .slider-container { margin: 1rem 0; }
    input[type="range"] { width: 100%; }
    .productivity-rating { display: none; margin-top: 1rem; }
    .stats-container, .projects-container, .history-container { display: none; }
    nav {
      display: flex;
      justify-content: space-around;
      padding: 1rem;
      border-top: 1px solid var(--color-divider);
      background: var(--color-surface);
    }
    nav div { cursor: pointer; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
  </style>
</head>
<body>
  <header>
    <div class="logo">Venato Study</div>
    <div id="date"></div>
  </header>
  <main id="app-content">
    <div id="view-today">
      <h1 style="font-family: var(--font-display); margin-bottom: 0.5rem;">Today</h1>
      <div class="timer-container">
        <div id="active-project-name">No Active Project</div>
        <div class="timer-display" id="timer">00:00:00</div>
        <div class="btn-row">
          <button id="start-btn" class="primary">Start Session</button>
          <button id="manual-btn">Manual Log</button>
        </div>
        <div class="slider-container">
          <label>Slide to finish and rate</label>
          <input type="range" id="finish-slider" min="0" max="100" value="0">
        </div>
      </div>
      <div id="rating-modal" style="display:none; background: var(--color-surface-2); border: 1px solid var(--color-border); padding: 1rem; border-radius: 1rem;">
        <p>How productive was this session?</p>
        <div class="btn-row">
          <button class="rate-btn" data-val="1">1</button>
          <button class="rate-btn" data-val="2">2</button>
          <button class="rate-btn" data-val="3">3</button>
          <button class="rate-btn" data-val="4">4</button>
          <button class="rate-btn" data-val="5">5</button>
        </div>
      </div>
    </div>
    <div id="view-projects" style="display:none;">
      <h1>Projects</h1>
      <button id="new-project-btn">+ New Project</button>
      <div id="project-list"></div>
    </div>
    <div id="view-history" style="display:none;">
      <h1>History</h1>
      <div id="history-list"></div>
    </div>
    <div id="view-stats" style="display:none;">
      <h1>Stats</h1>
      <div id="stats-summary"></div>
      <button id="export-json">Export JSON</button>
    </div>
  </main>
  <nav>
    <div onclick="showView('today')">Today</div>
    <div onclick="showView('history')">History</div>
    <div onclick="showView('stats')">Stats</div>
    <div onclick="showView('projects')">Projects</div>
  </nav>
  <script>
    let timerInterval;
    let seconds = 0;
    let activeProject = null;
    let sessions = JSON.parse(localStorage.getItem('venato_sessions') || '[]');
    let projects = JSON.parse(localStorage.getItem('venato_projects') || '[]');

    document.getElementById('date').innerText = new Date().toLocaleDateString();

    function showView(view) {
      ['today', 'projects', 'history', 'stats'].forEach(v => {
        document.getElementById('view-' + v).style.display = (v === view) ? 'block' : 'none';
      });
      if(view === 'history') renderHistory();
      if(view === 'projects') renderProjects();
      if(view === 'stats') renderStats();
    }

    document.getElementById('start-btn').onclick = function() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
        this.innerText = 'Resume Session';
      } else {
        timerInterval = setInterval(() => {
          seconds++;
          updateTimerDisplay();
        }, 1000);
        this.innerText = 'Pause Session';
      }
    };

    function updateTimerDisplay() {
      let hrs = Math.floor(seconds / 3600);
      let mins = Math.floor((seconds % 3600) / 60);
      let secs = seconds % 60;
      document.getElementById('timer').innerText = 
        String(hrs).padStart(2, '0') + ':' + 
        String(mins).padStart(2, '0') + ':' + 
        String(secs).padStart(2, '0');
    }

    document.getElementById('finish-slider').oninput = function() {
      if (this.value == 100) {
        clearInterval(timerInterval);
        timerInterval = null;
        document.getElementById('rating-modal').style.display = 'block';
        this.value = 0;
      }
    };

    document.querySelectorAll('.rate-btn').forEach(btn => {
      btn.onclick = function() {
        let rating = this.getAttribute('data-val');
        saveSession(rating);
        document.getElementById('rating-modal').style.display = 'none';
        seconds = 0;
        updateTimerDisplay();
        document.getElementById('start-btn').innerText = 'Start Session';
        alert('Session Saved!');
      };
    });

    function saveSession(rating) {
      let session = {
        project: activeProject ? activeProject.name : 'Unlabeled',
        duration: seconds,
        rating: rating,
        date: new Date().toISOString()
      };
      sessions.push(session);
      localStorage.setItem('venato_sessions', JSON.stringify(sessions));
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      list.innerHTML = sessions.map(s => `
        <div style="border-bottom: 1px solid #ccc; padding: 0.5rem;">
          <strong>${s.project}</strong> - ${Math.floor(s.duration/60)}m - Rating: ${s.rating}
          <div style="font-size:0.7rem;">${new Date(s.date).toLocaleString()}</div>
        </div>
      `).join('');
    }

    function renderProjects() {
      const list = document.getElementById('project-list');
      list.innerHTML = projects.map(p => `
        <div onclick="setActiveProject('${p.name}')" style="padding: 1rem; border: 1px solid #ccc; margin: 0.5rem 0; border-radius: 0.5rem; cursor:pointer; background: ${activeProject && activeProject.name === p.name ? '#d4e3da' : 'white'}">
          ${p.name} (${p.subject})
        </div>
      `).join('');
    }

    window.setActiveProject = function(name) {
      activeProject = projects.find(p => p.name === name);
      document.getElementById('active-project-name').innerText = activeProject.name;
      showView('today');
    };

    document.getElementById('new-project-btn').onclick = function() {
      let name = prompt('Project Name:');
      let subject = prompt('Subject:');
      if (name && subject) {
        projects.push({name, subject});
        localStorage.setItem('venato_projects', JSON.stringify(projects));
        renderProjects();
      }
    };

    function renderStats() {
      let totalSeconds = sessions.reduce((acc, s) => acc + s.duration, 0);
      let avgRating = (sessions.reduce((acc, s) => acc + parseInt(s.rating), 0) / (sessions.length || 1)).toFixed(1);
      document.getElementById('stats-summary').innerHTML = `
        <p>Total Study Time: ${Math.floor(totalSeconds / 60)} minutes</p>
        <p>Average Productivity: ${avgRating} / 5</p>
        <p>Sessions Completed: ${sessions.length}</p>
      `;
    }

    document.getElementById('export-json').onclick = function() {
      let data = {
        sessions: sessions,
        projects: projects,
        exportedAt: new Date().toISOString(),
        venatoPoints: sessions.reduce((acc, s) => acc + (s.duration / 60) * s.rating, 0).toFixed(0)
      };
      let blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
      let url = URL.createObjectURL(blob);
      let a = document.createElement('a');
      a.href = url;
      a.download = 'venato_study_export.json';
      a.click();
    };
  </script>
</body>
</html>
